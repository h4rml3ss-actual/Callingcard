; Callingcard standalone ADV baseline (Wi-Fi survey smoke test)
; Toolchain/library versions are initial candidates: validate with physical hardware.
[env:cardputer-adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  https://github.com/m5stack/M5Cardputer.git
