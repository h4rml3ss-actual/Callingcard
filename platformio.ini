; Callingcard hardware baseline + Cap LoRa-1262 bring-up
[env:cardputer-adv]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -DESP32S3
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=1
  ; 1 = Meshtastic US LongFast passive PHY; 0 = legacy 915 MHz test PHY
  -DCALLINGCARD_LORA_PROFILE=1
lib_deps =
  M5Cardputer=https://github.com/m5stack/M5Cardputer
  RadioLib=https://github.com/jgromes/RadioLib
  TinyGPSPlus=https://github.com/m5stack/TinyGPSPlus

; Explicit opt-in because GATT advertising while passive BLE scanning
; needs coexistence validation on physical Cardputer ADV.
[env:cardputer-blade-poc]
extends = env:cardputer-adv
build_flags =
  ${env:cardputer-adv.build_flags}
  -DCALLINGCARD_BLADE_POC=1

; Diagnostic: isolates GATT peripheral from continuous BLE scan cycles.
[env:cardputer-blade-gatt-only]
extends = env:cardputer-adv
build_flags =
  ${env:cardputer-adv.build_flags}
  -DCALLINGCARD_BLADE_POC=1
  -DCALLINGCARD_BLADE_GATT_ONLY=1

; Opt-in experimental coexistence: connect Blade first, then BLE survey windows.
[env:cardputer-blade-coexist]
extends = env:cardputer-adv
build_flags =
  ${env:cardputer-adv.build_flags}
  -DCALLINGCARD_BLADE_POC=1
  -DCALLINGCARD_BLADE_COEXIST=1

; Opt-in wearable alert stream, based on tested connected-first coexistence.
[env:cardputer-blade-alerts]
extends = env:cardputer-adv
build_flags =
  ${env:cardputer-adv.build_flags}
  -DCALLINGCARD_BLADE_POC=1
  -DCALLINGCARD_BLADE_COEXIST=1
  -DCALLINGCARD_BLADE_ALERTS=1

; Opt-in scanner detail streaming. Unauthenticated, sends short SSIDs/BLE names.
[env:cardputer-blade-details]
extends = env:cardputer-adv
build_flags =
  ${env:cardputer-adv.build_flags}
  -DCALLINGCARD_BLADE_POC=1
  -DCALLINGCARD_BLADE_COEXIST=1
  -DCALLINGCARD_BLADE_ALERTS=1
  -DCALLINGCARD_BLADE_DETAILS=1

; Security trial: bonded passkey enrollment, MITM-protected encrypted GATT.
; Keep the validated blade-details environment available for rollback.
[env:cardputer-blade-secure]
extends = env:cardputer-adv
build_flags =
  ${env:cardputer-adv.build_flags}
  -DCALLINGCARD_BLADE_POC=1
  -DCALLINGCARD_BLADE_COEXIST=1
  -DCALLINGCARD_BLADE_ALERTS=1
  -DCALLINGCARD_BLADE_DETAILS=1
  -DCALLINGCARD_BLADE_SECURE=1

; Controlled SMP isolation: pause Wi-Fi and BLE survey activity while
; a Blade is physically connected but not yet MITM-authenticated.
[env:cardputer-blade-secure-quiet]
extends = env:cardputer-blade-secure
build_flags =
  ${env:cardputer-blade-secure.build_flags}
  -DCALLINGCARD_BLADE_PAIRING_QUIET=1

; Opt-in APPLICATION-LAYER secure prototype. No legacy Blade GATT service.
; Developer USB provisioning only; NVS key at rest not flash-encrypted.
; DO NOT deploy as a finished protected wearable until PR55/56 validation.
[env:cardputer-cstp-dev]
extends = env:cardputer-adv
build_flags =
  ${env:cardputer-adv.build_flags}
  -DCALLINGCARD_CSTP_APP_SECURE=1
  -DCALLINGCARD_CSTP_DEV_USB_PROVISION=1

; PR56: exclusive NimBLE pairing diagnostic. No main.cpp, BLE scans, SD, LoRa.
; Uses the existing Blade app's service UUID/name to test normal Android bonding.
[env:cardputer-nimble-pairing-test]
extends = env:cardputer-adv
build_src_filter =
  -<*>
  +<nimble_pairing_test.cpp>
lib_deps =
  h2zero/NimBLE-Arduino@2.5.1
build_flags =
  ${env:cardputer-adv.build_flags}
  -DCALLINGCARD_NIMBLE_PAIRING_TEST=1
